<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" href="images/icon.png" type="image/png" />
    <title>MovieFlix</title>
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <a href="menu.html">
          <img src="/images/FLIX.png" alt="logo" />
        </a>
      </div>
      <div class="categories">
        <i class="fa-solid fa-layer-group" id="list-categories"></i>
        <div class="dropdown-categories" id="dropdown-categories">
          <!-- Gêneros -->
        </div>
      </div>
      <div class="magnifying-glass">
        <i class="fa-solid fa-magnifying-glass" id="magnifying-glass"></i>
      </div>
      <div class="user-icon">
        <i class="fa-solid fa-user" id="user-icon"></i>
        <div class="dropdown-menu" id="dropdown-menu">
          <a href="#">Meu perfil</a>
          <a href="#">Sair</a>
        </div>
      </div>
      <div class="mode-toggle">
        <button id="light-mode-toggle">
          <i class="fa-solid fa-toggle-off"></i>
        </button>
      </div>
    </header>
    <main class="menu" id="menu">
      <section class="series" id="series">
        <h2>Séries e Animes</h2>
        <div class="wrapper">
          <ul class="list" id="seriesList">
            <!-- li Séries -->
          </ul>
          <button class="prev-button">
            <i class="fa-solid fa-circle-arrow-left"></i>
          </button>
          <button class="next-button">
            <i class="fa-solid fa-circle-arrow-right"></i>
          </button>
        </div>
      </section>
      <section class="acao" id="1">
        <h2>Ação</h2>
        <div class="wrapper">
          <ul class="list" id="acaoList">
            <!-- li Ação -->
          </ul>
          <button class="prev-button">
            <i class="fa-solid fa-circle-arrow-left"></i>
          </button>
          <button class="next-button">
            <i class="fa-solid fa-circle-arrow-right"></i>
          </button>
        </div>
      </section>
      <section class="animes" id="2">
        <h2>Animes</h2>
        <div class="wrapper">
          <ul class="list" id="animesList">
            <!-- li Animes -->
          </ul>
          <button class="prev-button">
            <i class="fa-solid fa-circle-arrow-left"></i>
          </button>
          <button class="next-button">
            <i class="fa-solid fa-circle-arrow-right"></i>
          </button>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>&copy; 2025 MovieFlix. Todos os direitos reservados.</p>
    </footer>
    <script src="js/series.js"></script>
  </body>
</html>
