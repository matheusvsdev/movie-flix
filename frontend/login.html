<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>MovieFlix</title>
  </head>
  <body>
    <div class="container">
        <div class="left-side">
            <img src="/images/FLIX.png" alt="logo">
            <input type="email" placeholder="Email" class="input-field">
            <input type="password" placeholder="Senha" class="input-field">
            <a href="#" class="forgot-password">Esqueci minha senha</a>
            <button class="btn">Entrar</button>
            <p>Não tem uma conta? <a href="/signUp.html" class="create-account">Clique aqui</a></p>
        </div>
        <div class="right-side">
            <img src="/images/banner-login.png" alt="Banner">
        </div>
    </div>
  </body>
</html>
